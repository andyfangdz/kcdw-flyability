# Install as <service>.service.d/typesafe.conf to enable that service.
# The API key stays in the private var/typesafe-api-key file.
[Service]
Environment=KCDW_TYPESAFE=required
Environment=CODEX_BIN=/home/andy/.local/bin/codex
# Codex's trusted CLI maintains its login/cache here; model file tools are disabled.
ReadWritePaths=/home/andy/.codex
